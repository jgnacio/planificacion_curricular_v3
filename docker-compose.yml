version: '3.8'
services:
  neo4j:
    image: neo4j:latest
    container_name: anep-knowledge-graph
    ports:
      - "7474:7474" # Interfaz web
      - "7687:7687" # Puerto Bolt para conexiones desde tu backend
    environment:
      - NEO4J_AUTH=neo4j/anep_secreto_2026
      - NEO4J_PLUGINS=["apoc"] # Recomendado para importar y manejar datos complejos
      - NEO4J_AUTH=none
    volumes:
      - ./neo4j_data:/data
      - ./neo4j_logs:/logs