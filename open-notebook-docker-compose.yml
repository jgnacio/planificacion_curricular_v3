services:
  surrealdb:
    image: surrealdb/surrealdb:v2
    command: start --log info --user root --pass root rocksdb:/mydata/mydatabase.db
    user: root
    ports:
      - "8000:8000"
    volumes:
      - ./surreal_data:/mydata
    restart: always

  open_notebook:
    image: lfnovo/open_notebook:v1-latest
    dns:
      - 8.8.8.8
      - 8.8.4.4
    ports:
      - "8502:8502"
      - "5055:5055"
    environment:
      - OPEN_NOTEBOOK_ENCRYPTION_KEY=SSEK
      - SURREAL_URL=ws://surrealdb:8000/rpc
      - SURREAL_USER=root
      - SURREAL_PASSWORD=root
      - SURREAL_NAMESPACE=open_notebook
      - SURREAL_DATABASE=open_notebook
      - GOOGLE_CLOUD_PROJECT=facilitador-docente
      - VERTEX_PROJECT=facilitador-docente
      - GOOGLE_APPLICATION_CREDENTIALS=/app/credentials/service-account.json
    volumes:
      - ./notebook_data:/app/data
      - /home/jgnacio/Documents/Bit-A/facilitador-docente-79a7cf41f982.json:/app/credentials/service-account.json:ro
      - ./scripts/gcloud-wrapper.sh:/usr/local/bin/gcloud:ro
    depends_on:
      - surrealdb
    restart: always