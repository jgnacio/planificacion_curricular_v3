[project]
name = "planificacion-curricular"
version = "0.1.0"
description = "Facilitador Docente EBI — backend completo (API + agente + extractor)"
requires-python = ">=3.11"
dependencies = [
    # API
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "python-jose[cryptography]>=3.3.0",
    # Agente
    "google-adk==1.33.0",
    "google-genai>=1.14.0",
    "duckduckgo-search>=6.0.0",
    "beautifulsoup4>=4.12.0",
    # Extractor
    "pdfplumber>=0.11.0",
    "pyyaml>=6.0",
    # Compartido
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "alembic>=1.18.4",
    "mercadopago>=2.4.0",
    "google-cloud-aiplatform[agent-engines]==1.153.1",
]

[project.scripts]
curriculum-extractor = "curriculum_extractor.run:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["curriculum_extractor"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
